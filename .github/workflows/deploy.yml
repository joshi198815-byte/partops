name: Deploy

# Despliegue en serie, con aprobación y verificación real.
#
# El orden importa y es el motivo de que esto sea un workflow y no dos botones:
#   1. Migrar la base (el esquema tiene que aceptar el código nuevo antes de que corra).
#   2. Construir y desplegar la API.
#   3. Esperar a que `/health/ready` devuelva **nuestro** SHA. Un deploy que "ya disparó" no es un
#      deploy hecho; Render puede tardar minutos o quedarse en la versión anterior.
#   4. Desplegar la web y esperar a que su cabecera `x-partops-commit` diga lo mismo.
#   5. Humo completo.
#
# Si el paso 3 falla, la web no se toca: se queda sirviendo una versión que al menos habla con una
# API que conoce. Desplegar la web contra una API a medio migrar es cómo se rompe un viernes.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "apps/mobile/**"
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Saltar migraciones (solo si ya corrieron a mano)"
        type: boolean
        default: false

# Nunca dos despliegues a la vez, y nunca cancelar uno a medias: cancelar entre la migración y el
# despliegue deja la base adelante del código.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Puerta de entrada: comprobar la configuración **antes** de tocar la base.
  #
  # Sin esto, un valor faltante se descubre a la mitad del despliegue: la migración ya corrió, la
  # API ya se disparó y el fallo aparece como un `curl` con 403 que no dice qué falta. Aquí se
  # incumple una regla de dinero: una migración sin despliegue deja el esquema adelante del código.
  #
  # Dos clases de dato, a propósito:
  #   · `vars.*`  → URLs públicas. No son secretas y se pueden leer en el log y en el repo.
  #   · `secrets.*` → cadena de conexión y hooks. Un hook es una credencial: quien lo tiene despliega.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Revisar configuración requerida
        id: check
        env:
          DIRECT_DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_DATABASE_URL }}
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          WEB_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: |
          set -uo pipefail
          missing=()
          [ -n "$DIRECT_DATABASE_URL" ] || missing+=("secreto PRODUCTION_DIRECT_DATABASE_URL")
          [ -n "$API_URL" ]             || missing+=("variable PRODUCTION_API_URL")
          [ -n "$WEB_URL" ]             || missing+=("variable PRODUCTION_WEB_URL")
          [ -n "$API_HOOK" ]            || missing+=("secreto RENDER_API_DEPLOY_HOOK")
          [ -n "$WEB_HOOK" ]            || missing+=("secreto RENDER_WEB_DEPLOY_HOOK")

          # `is_missing` consulta el array sin expandirlo vacío (bash con `nounset` lo odia).
          is_missing() {
            local needle="$1" item
            for item in ${missing[@]+"${missing[@]}"}; do
              [ "$item" = "$needle" ] && return 0
            done
            return 1
          }

          {
            echo "### Configuración del despliegue"
            echo ""
            echo "| Dato | Tipo | Estado |"
            echo "| --- | --- | --- |"
            for name in "secreto PRODUCTION_DIRECT_DATABASE_URL" "variable PRODUCTION_API_URL" \
                        "variable PRODUCTION_WEB_URL" "secreto RENDER_API_DEPLOY_HOOK" \
                        "secreto RENDER_WEB_DEPLOY_HOOK"; do
              if is_missing "$name"; then
                echo "| \`${name#* }\` | ${name%% *} | ❌ falta |"
              else
                echo "| \`${name#* }\` | ${name%% *} | ✅ |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Falta configuración del entorno 'production': ${missing[*]}. Ver RUNBOOK.md § 8 · El despliegue automático no corre."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --filter @partops/db... --filter @partops/contracts...

      # ── 1 · Esquema ──────────────────────────────────────────────────────────
      - name: Migrar producción
        if: ${{ !inputs.skip_migrations }}
        env:
          # Rol DUEÑO: las migraciones crean tablas y políticas. La API usa el rol sin privilegios.
          DIRECT_DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_DATABASE_URL }}
        run: pnpm --filter @partops/db migrate:deploy

      # ── 2 · API ──────────────────────────────────────────────────────────────
      - name: Disparar despliegue de la API
        env:
          HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Falta RENDER_API_DEPLOY_HOOK en los secretos del entorno production."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$HOOK"

      # ── 3 · Esperar el SHA ───────────────────────────────────────────────────
      - name: Esperar a que la API sirva este commit
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while [ $SECONDS -lt $deadline ]; do
            body=$(curl --silent --max-time 10 "$API_URL/api/health/ready" || true)
            # `grep -q` sobre el JSON en crudo: no hace falta un parser para buscar un SHA.
            if echo "$body" | grep -q "\"commit\":\"${SHA:0:8}"; then
              echo "La API ya sirve ${SHA:0:8}."
              exit 0
            fi
            echo "Aún no: $(echo "$body" | head -c 200)"
            sleep 15
          done
          echo "::error::La API no sirvió $SHA en 10 minutos. Revisar el log del servicio en Render."
          exit 1

      # ── 4 · Web ──────────────────────────────────────────────────────────────
      - name: Desplegar la web
        env:
          HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
          WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Falta RENDER_WEB_DEPLOY_HOOK en los secretos del entorno production."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$HOOK"

          # La web se construye (Next compila en el deploy), así que tarda más que la API en
          # arrancar pero menos que una migración. Se sondea la cabecera horneada en vez de dormir
          # un tiempo fijo: `sleep 60` da verde contra el contenedor viejo si el build tarda más.
          deadline=$((SECONDS + 600))
          while [ $SECONDS -lt $deadline ]; do
            served=$(curl --silent --max-time 10 --head "$WEB_URL/entrar" 2>/dev/null \
              | tr -d '\r' | awk 'tolower($1)=="x-partops-commit:"{print $2}')
            if [ "${served:0:8}" = "${SHA:0:8}" ]; then
              echo "La web ya sirve ${SHA:0:8}."
              exit 0
            fi
            echo "Aún no: la web sirve '${served:-sin cabecera}'"
            sleep 10
          done
          echo "::error::La web no sirvió $SHA en 10 minutos. Revisar el log del build en Render."
          exit 1

      # ── 5 · Humo ─────────────────────────────────────────────────────────────
      - name: Humo de producción
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_WEB_URL }}
          SMOKE_API_URL: ${{ vars.PRODUCTION_API_URL }}
          SMOKE_EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/smoke-api.mjs

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Despliegue"
            echo ""
            echo "| Dato | Valor |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA:0:8}\` |"
            echo "| Resultado | ${{ job.status }} |"
            echo "| Ejecutado por | @${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"
