<!doctype html>
<html lang="es-GT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>PartOps</title>
    <style>
      /* Fondo de asfalto claro: el mismo #0E2233 del splash, para que el paso del splash a esta
         pantalla no se note como un destello blanco. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e2233;
        color: #f7f5f1;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
      }
      .name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.72;
      }
      .bar {
        width: 96px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(247, 245, 241, 0.18);
      }
      .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #b4703a;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- La tuerca abierta, en línea: sin petición de red, porque justamente aquí la red es lo
           que puede faltar. -->
      <svg class="mark" viewBox="0 0 48 48" role="img" aria-label="PartOps">
        <path
          d="M24 5.6 L39.9 14.8 L39.9 33.2 L24 42.4 L8.1 33.2 L8.1 14.8 Z"
          fill="#F7F5F1"
        />
        <path d="M39.9 33.2 L24 42.4 L28.2 29.4 Z" fill="#B4703A" />
        <path d="M24 18.4 L31 22.4 L31 30.4 L24 34.4 L17 30.4 L17 22.4 Z" fill="#0E2233" />
      </svg>
      <p class="name">PartOps</p>
      <div class="bar" aria-hidden="true"></div>
      <p id="state" style="font-size: 12px; opacity: 0.6; margin: 0">Abriendo la bodega…</p>
    </div>

    <script>
      // Arranque de la cáscara.
      //
      // La app vive en el servidor, así que el APK solo tiene que abrirla. Si en 4 s no cargó, no se
      // deja una pantalla en blanco: se va a `offline.html`, que explica qué pasó y ofrece reintentar.
      //
      // `location.replace` y no `assign`: sin esto, el botón «atrás» de Android vuelve a este
      // cargador y el bodeguero queda rebotando entre dos pantallas idénticas.
      var target = '__SERVER_URL__';
      var TIMEOUT = 4000;
      var state = document.getElementById('state');

      function offline() {
        location.replace('offline.html');
      }

      var timer = setTimeout(offline, TIMEOUT);

      // Una petición `no-cors` no dice si la respuesta fue buena, solo si hubo respuesta. Para
      // distinguir «no hay red» de «el servidor está caído» basta: si el `fetch` resuelve, hay
      // camino hasta alguna parte y vale la pena navegar.
      fetch(`${target}/health/live`, { method: 'GET', mode: 'no-cors', cache: 'no-store' })
        .then(() => {
          clearTimeout(timer);
          if (state) state.textContent = 'Entrando…';
          location.replace(target);
        })
        .catch(() => {
          clearTimeout(timer);
          offline();
        });
    </script>
  </body>
</html>
